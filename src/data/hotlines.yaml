# Emergency and public service hotlines
# TODO: replace every [placeholder] number with the official number and verify
# it by calling before publishing. Numbers marked national are nationwide.
#
# Fields: name, description, numbers (list), icon (Lucide icon name), emergency (true = shown on home page)
groups:
